# ==============================================================================
# PHASE 4.0.4 — LOCKED TRAINING SPECIFICATION
# HARDWARE TARGET: NVIDIA RTX 3050 6GB / NVIDIA RTX 3050 8GB
# PROTOCOL CONFORMANCE: Phase 4.0.2 / 4.0.3 Scientific Lock
# ==============================================================================

protocol_version: "4.0.4"
status: "LOCKED"
research_project: "SA-CMS: Structure-Aligned Continual Memory Systems"

hardware:
  target_gpu_family: "RTX 3050"
  allowed_gpu_substrings:
    - "RTX 3050"
    - "GeForce RTX 3050"
    - "RTX 3050 Laptop GPU"
    - "RTX 3050 6GB"
    - "RTX 3050 8GB"
    - "RTX 3050 OEM"
  allowed_vram_range_gb: [5.0, 9.0]
  device: "cuda:0"
  enforce_strict_gpu: true
  allow_cpu_fallback: false

model:
  backbone_name_or_path: "HuggingFaceTB/SmolLM2-135M"
  backbone_frozen: true
  backbone_parameter_count: 134515008
  enable_cms: true
  trainable_components:
    - "cms"
    - "cms_norm"
    - "gates"
  precision: "float32"

training_hyperparameters:
  sample_count: 200
  epochs: 3
  learning_rate: 1.0e-4
  weight_decay: 0.01
  gradient_clipping: 1.0
  batch_size: 2
  gradient_accumulation_steps: 2
  effective_batch_size: 4
  max_sequence_length: 256
  optimizer: "AdamW"
  warmup_ratio: 0.0
  seed_policy: "independent_per_run"
  seeds: [42, 43, 44]

data:
  train_file: "data/train/train_200_samples.json"
  validation_file: "data/validation/val_50_samples.json"
  train_sample_count: 200
  train_doc_count: 20
  val_sample_count: 50
  val_doc_count: 5
  test_data_forbidden: true

methods:
  B4:
    name: "Single-Level Adapter"
    num_levels: 1
    update_schedule: "single_level"
    trainable_samples: 200
  B5:
    name: "Fixed-Token CMS"
    num_levels: 3
    update_schedule: "fixed_token"
    trainable_samples: 200
  P1:
    name: "Structure-Aligned CMS (SA-CMS)"
    num_levels: 3
    update_schedule: "structure"
    trainable_samples: 200
  P2:
    name: "SA-CMS + Retrieval Hybrid"
    num_levels: 3
    update_schedule: "structure"
    trainable_samples: 200
    memory_inherited_from_p1: true

output:
  checkpoints_dir: "output/checkpoints"
  logs_dir: "output/logs"
  checkpoint_naming_pattern: "cms_{num_levels}lvl_seed_{seed}.pt"
